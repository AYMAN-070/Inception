events {}

http {
    include /etc/nginx/mime.types;

    server {
        # listen only on 443 port (HTTPS)
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name ayhammou.42.fr;

        # Paths to the certificate generated in the Dockerfile
        ssl_certificate /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;

        #   Strict rule for the subject: TLSv1.2 or TLSv1.3 only
        ssl_protocols TLSv1.2 TLSv1.3;

        # Website file location
        root /var/www/html;
        index index.php index.html index.htm;

		location / {
        try_files $uri $uri/ /index.php?$args;
		}

        # Redirect all PHP requests to the WordPress container on port 9000
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass wordpress:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }
}